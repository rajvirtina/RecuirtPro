version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: recruitpro-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD must be set in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-recruitpro}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - recruitpro-network

  redis:
    image: redis:7-alpine
    container_name: recruitpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - recruitpro-network

  # BUG-004: Backend service (Dockerfile is production-ready)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitpro-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/recruitpro?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5001
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      llm-service:
        condition: service_started
    networks:
      - recruitpro-network
    healthcheck:
      # Use node directly — guaranteed present in the Node.js image, no wget/curl dependency
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5001/health', r => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitpro-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - recruitpro-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # TURN server — required for WebRTC behind corporate firewalls/strict NAT.
  # Set SERVER_IP, TURN_USERNAME, TURN_PASSWORD in the host environment or a .env file.
  # Ports: 3478 = STUN/TURN (UDP+TCP), 5349 = TURNS/TLS (UDP+TCP),
  #        49152-65535 = relay media range.
  coturn:
    image: coturn/coturn:latest
    container_name: recruitpro-coturn
    restart: unless-stopped
    network_mode: host            # TURN requires the real external IP; host networking is simplest
    environment:
      DETECT_EXTERNAL_IP: "yes"
      EXTERNAL_IP: "${SERVER_IP}"
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=65535
      --realm=${TURN_REALM:-recruitpro.local}
      --user=${TURN_USERNAME:-recruitpro}:${TURN_PASSWORD:?TURN_PASSWORD must be set}
      --lt-cred-mech
      --no-multicast-peers
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: recruitpro-llm-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      API_SECRET_KEY: ${LLM_API_SECRET_KEY:-default-secret-key}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5001
      SERVICE_PORT: 8001
      LOG_LEVEL: INFO
    networks:
      - recruitpro-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── MongoDB Backup (DR strategy) ─────────────────────────────────────────────
  # Runs mongodump daily at 02:00 UTC; retains 7 days of backups.
  # Mount a host directory to ./backups or use a named volume for persistence.
  mongo-backup:
    image: mongo:7.0
    container_name: recruitpro-mongo-backup
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_backups:/backups
    networks:
      - recruitpro-network
    # crond runs mongodump daily at 02:00 UTC and purges dumps older than 7 days
    entrypoint: >
      /bin/bash -c "
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
          mongodump
            --host mongodb:27017
            --username $$MONGO_INITDB_ROOT_USERNAME
            --password $$MONGO_INITDB_ROOT_PASSWORD
            --authenticationDatabase admin
            --db recruitpro
            --out /backups/$$TIMESTAMP
            --gzip;
          find /backups -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true;
          echo \"[backup] Dump completed: $$TIMESTAMP\";
          sleep 86400;
        done
      "

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  mongo_backups:

networks:
  recruitpro-network:
    driver: bridge
