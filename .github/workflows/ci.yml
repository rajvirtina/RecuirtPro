name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Secrets scanning — runs first, blocks everything else if secrets found ────
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so gitleaks can scan all commits on the PR

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend-lint:
    needs: [secrets-scan]
    name: Backend — Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

  backend-test:
    needs: [secrets-scan]
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-min-32-chars-long-enough
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
      REDIS_HOST: ''
      ENABLE_EMAIL_VERIFICATION: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --forceExit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  backend-build:
    name: Backend — Build
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend-lint:
    needs: [secrets-scan]
    name: Frontend — Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:5001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Docker ────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build image (no push)
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t recruitpro-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t recruitpro-frontend:ci ./frontend

  # ── Deploy to production ──────────────────────────────────────────────────────
  # Runs only on version tags (e.g. git tag v1.2.3 && git push --tags)
  # Requires three GitHub repository secrets:
  #   DEPLOY_HOST       — Hostinger VPS IP or hostname
  #   DEPLOY_USER       — SSH username (e.g. u212589665)
  #   DEPLOY_SSH_KEY    — Private key matching the authorised_keys on the server
  deploy:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/domains/hiring.ambiquest.com/public_html
            git fetch --tags --force
            git checkout ${{ github.ref_name }}
            docker compose pull --quiet 2>/dev/null || true
            docker compose build --no-cache backend frontend
            docker compose up -d --remove-orphans
            # Health check — wait up to 60 s for backend to be healthy
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' recruitpro-backend 2>/dev/null || echo "starting")
              [ "$STATUS" = "healthy" ] && echo "Deploy ${{ github.ref_name }} successful." && exit 0
              echo "Health: $STATUS ($i/12)..."; sleep 5
            done
            echo "ERROR: backend did not become healthy after deploy" >&2; exit 1
